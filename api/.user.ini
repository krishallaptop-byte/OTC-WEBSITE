; Disable PHP's automatic $_POST/$_FILES population for requests handled
; under api/ so we can parse multipart/form-data bodies ourselves via
; lib/multipart.php. This is required to correctly support uploading
; MULTIPLE files under the same field name ("files"), which the frontend
; sends without array-bracket syntax (FormData.append('files', file) in a
; loop) — PHP's native parser only groups repeated file fields correctly
; when the field name ends in "[]", so without this override any upload
; of 2+ files at once would silently keep only the last file.
;
; NOTE: .user.ini settings are picked up by PHP-FPM (used by virtually all
; cPanel hosts) automatically, no extra Apache/php.ini configuration
; needed. It can take up to `user_ini.cache_ttl` (default 300s) to be
; picked up after upload; if uploads seem to lose files immediately after
; first deploying, wait a few minutes or restart PHP-FPM from cPanel.
enable_post_data_reading = Off
