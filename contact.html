<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Orchid Tech Club</title>
<link rel="icon" href="/static/images/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="contact">

<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>Contact Us</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> / Contact</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="contact-wrap">
      <div class="card">
        <h3 style="color:#fff;margin-top:0;">Send Message</h3>
        <form id="contact-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea class="form-control" placeholder="Write your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        </form>
      </div>

      <div>
        <h3 style="color:#fff;margin-top:0;">Get In Touch</h3>
        <div class="contact-info-item">
          <div class="ic"><i class="fas fa-map-marker-alt"></i></div>
          <div><h5>Address</h5><p id="contact-address">Loading...</p></div>
        </div>
        <div class="contact-info-item">
          <div class="ic"><i class="fas fa-envelope"></i></div>
          <div><h5>Email</h5><a id="contact-email" href="#">Loading...</a></div>
        </div>
        <div class="contact-info-item">
          <div class="ic"><i class="fas fa-phone"></i></div>
          <div><h5>Phone</h5><p id="contact-phone">Loading...</p></div>
        </div>
        <div class="map-frame">
          <iframe id="contact-map" src="" loading="lazy"></iframe>
        </div>
        <a id="contact-map-link" href="#" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="margin-top:12px;">
          <i class="fas fa-location-arrow"></i> View on Google Maps
        </a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script>
async function renderContact() {
  try {
    const settings = await OTCApi.getContent('settings');
    document.getElementById('contact-address').textContent = settings.address || 'Bharatpur-10, Chitwan, Nepal';
    document.getElementById('contact-email').textContent = settings.email || 'orchidtechclub@gmail.com';
    document.getElementById('contact-email').href = 'mailto:' + (settings.email || 'orchidtechclub@gmail.com');
    document.getElementById('contact-phone').textContent = settings.phone || '+977 980-0000000';
    document.getElementById('contact-map').src = settings.mapUrl || 'https://www.google.com/maps?q=27.6689062,84.4317981&z=16&output=embed';
    document.getElementById('contact-map-link').href = settings.mapLink || 'https://maps.app.goo.gl/ubW3cY4NGfbgAbUn9';
  } catch (e) {
    console.error('Failed to load contact settings', e);
  }
}
renderContact();

document.getElementById('contact-form').addEventListener('submit', (e) => {
  e.preventDefault();
  alert('Thank you! Your message has been received.');
  e.target.reset();
});
</script>
</body>
</html>
