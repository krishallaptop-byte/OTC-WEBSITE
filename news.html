<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News & Notices — Orchid Tech Club</title>
<link rel="icon" href="/static/images/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="news">

<div id="site-header"></div>

<div class="page-banner">
  <div class="container">
    <h1>News & Notices</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> / News & Notices</div>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="notice">Notice</button>
      <button class="filter-tab" data-filter="event">Event</button>
      <button class="filter-tab" data-filter="workshop">Workshop</button>
      <button class="filter-tab" data-filter="achievement">Achievement</button>
    </div>

    <div class="grid grid-3" id="news-grid">
      <div class="otc-loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading news...</div>
    </div>

    <div class="text-center" style="margin-top:36px;">
      <button class="btn btn-outline" id="load-more-btn" style="display:none;">Load More</button>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/common.js"></script>
<script>
let allNews = [];
let currentFilter = 'all';
let visibleCount = 6;

function getFiltered() {
  if (currentFilter === 'all') return allNews;
  return allNews.filter(n => n.category === currentFilter);
}

function renderNews() {
  const list = getFiltered().slice(0, visibleCount);
  const mount = document.getElementById('news-grid');
  mount.innerHTML = list.map(n => `
    <div class="card news-card fade-in">
      <img src="${n.cover_image || '/static/images/logo.png'}" alt="${n.title}">
      <div class="body">
        <span class="news-tag tag-${n.category}">${n.category}</span>
        ${n.pinned ? '<span style="float:right;color:var(--purple);font-size:0.75rem;" title="Pinned"><i class="fas fa-thumbtack"></i></span>' : ''}
        <h4>${n.title}</h4>
        <p>${n.excerpt}</p>
        <div class="news-meta"><i class="far fa-calendar"></i> ${n.date}</div>
      </div>
    </div>`).join('') || `<p style="color:var(--text-dim);">No news found in this category.</p>`;

  const btn = document.getElementById('load-more-btn');
  btn.style.display = getFiltered().length > visibleCount ? 'inline-flex' : 'none';
}

document.getElementById('filter-tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.getAttribute('data-filter');
  visibleCount = 6;
  renderNews();
});

document.getElementById('load-more-btn').addEventListener('click', () => {
  visibleCount += 6;
  renderNews();
});

async function loadNews() {
  try {
    allNews = await OTCApi.getNews();
    renderNews();
  } catch (e) {
    document.getElementById('news-grid').innerHTML = `<p style="color:var(--danger);">Failed to load news. Please refresh the page.</p>`;
  }
}
loadNews();
</script>
</body>
</html>
